name: 'asset_discovery'
version: '1.0.0'
config-version: 2
profile: 'asset_discovery'
model-paths: ["models"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]
vars:
  gold: "../data/gold"      # path to Spark gold Parquet, relative to dbt/ working dir
models:
  asset_discovery:
    staging:
      # Materialize staging as TABLES so the 10M-row Parquet is read once into the
      # warehouse; marts then read from tables instead of re-scanning Parquet in
      # parallel (which otherwise spikes memory on small machines).
      +materialized: table
    marts:
      +materialized: table
