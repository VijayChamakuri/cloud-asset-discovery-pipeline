name: pipeline-ci
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '11' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - run: pip install -r requirements.txt
      - name: Unit tests (transforms + SNS/SQS via moto)
        run: pytest -q tests/
      - name: End-to-end smoke run on sample scale
        run: ./run.sh sample        # generate->bronze->silver->DQ gate->gold->spark-sql->warehouse->dbt
      - name: dbt models + schema tests
        run: cd dbt && dbt build --profiles-dir .
